<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <filter id="noise" x="0" y="0">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.22  0 0 0 0.18 0"/>
    </filter>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0.5" stop-color="#f4ead5"/>
      <stop offset="1" stop-color="#3a2418" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="#efe2c2"/>
  <rect width="600" height="600" filter="url(#noise)" opacity="0.55"/>
  <rect width="600" height="600" fill="url(#vignette)"/>
</svg>
